<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة نادي السباحة بشار CSB</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f3f7fb;
    color:#12304f;
}

.container{
    max-width:1100px;
    margin:20px auto;
    padding:15px;
}

.card{
    background:white;
    padding:20px;
    border-radius:16px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
    margin-bottom:20px;
}

h1,h2{
    color:#075b8e;
    text-align:center;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccd8e5;
    border-radius:9px;
    font-size:16px;
    margin-bottom:12px;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#0781d7;
    color:white;
    font-size:18px;
    font-weight:bold;
}

#dashboard{
    display:none;
}

.search{
    margin-top:10px;
}

.table-box{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

th,td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:right;
}

th{
    background:#075b8e;
    color:white;
}

.error{
    background:#ffe8e8;
    color:#a00000;
    padding:12px;
    border-radius:10px;
    margin-top:10px;
}

.success{
    background:#e8f8ed;
    color:#087c35;
    padding:12px;
    border-radius:10px;
    margin-top:10px;
}

.actions{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

.actions button{
    width:auto;
    padding:10px 18px;
    font-size:15px;
}

.btn-print{
    background:#075b8e;
}

.btn-delete{
    background:#c0392b;
    width:auto;
    padding:6px 12px;
    font-size:13px;
    font-weight:normal;
}

.btn-whatsapp{
    background:#25D366;
    width:auto;
    padding:6px 12px;
    font-size:13px;
    font-weight:normal;
}

.btn-upload{
    background:#f39c12;
    width:auto;
    padding:6px 10px;
    font-size:12px;
    font-weight:normal;
}

@media print{
    input, .actions, th:nth-last-child(-n+2), td:nth-last-child(-n+2){
        display:none !important;
    }
    .container > .card:first-child{
        display:none;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🏊 نادي السباحة بشار CSB</h1>

<h2>لوحة الإدارة</h2>

<input
    id="password"
    type="password"
    placeholder="أدخل كلمة مرور الإدارة">

<button onclick="login()">
دخول
</button>

<div id="message"></div>

</div>


<div id="dashboard">

<div class="card">

<h2>📊 التسجيلات</h2>

<p>
عدد المسجلين:
<strong id="count">0</strong>
</p>

<input
    class="search"
    id="search"
    placeholder="🔎 البحث عن سباح..."
    oninput="searchTable()">

<div class="actions">
<button class="btn-print" onclick="window.print()">🖨️ طباعة القائمة</button>
</div>
<div class="table-box">

<table>

<thead>

<tr>
<th>الصورة</th>
<th>رقم التسجيل</th>
<th>اسم الطفل</th>
<th>تاريخ الميلاد</th>
<th>الجنس</th>
<th>الفئة</th>
<th>المستوى</th>
<th>ولي الأمر</th>
<th>الهاتف</th>
<th>الاشتراك</th>
<th>المبلغ</th>
<th>الشهادة الطبية</th>
<th>شهادة الميلاد</th>
<th>واتساب</th>
<th>حذف</th>
</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

</div>

</div>

</div>


<script>

let registrations = [];


async function login(){

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    if(!password){

        message.innerHTML =
        '<div class="error">أدخل كلمة المرور.</div>';

        return;
    }

    message.innerHTML =
    "⏳ جارٍ تحميل التسجيلات...";


    try{

        const response =
        await fetch("/api/admin",{

            method:"GET",

            headers:{
                "x-admin-password":password
            }

        });


        const data =
        await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "كلمة المرور غير صحيحة"
            );

        }


        registrations =
            data.rows || [];


        document.getElementById("dashboard")
        .style.display="block";


        document.getElementById("count")
        .textContent =
        registrations.length;


        showTable(registrations);


        message.innerHTML =
        '<div class="success">✅ تم الدخول بنجاح.</div>';

    }

    catch(error){

        message.innerHTML =
        '<div class="error">❌ '+
        error.message+
        '</div>';

    }

}


function showTable(rows){

    const body =
        document.getElementById("tableBody");

    body.innerHTML="";


    rows.forEach(row=>{

        const tr =
            document.createElement("tr");


        const photoCell =
            document.createElement("td");

        if(row.child_photo_file){
            photoCell.innerHTML =
                '<img src="' + row.child_photo_file +
                '" style="width:50px;height:50px;object-fit:cover;border-radius:8px;cursor:pointer" onclick="window.open(this.src)">';
        } else {
            photoCell.innerHTML = makeUploadButton(row, "childPhoto");
        }

        tr.appendChild(photoCell);


        const values=[

            row.registration_number,
            row.child_name,
            row.birth_date,
            row.gender,
            row.age_group,
            row.level,
            row.parent_name,
            row.phone,
            row.subscription,
            (row.total_amount ?? "") + " دج"

        ];


        values.forEach(value=>{

            const td =
                document.createElement("td");

            td.textContent =
                value ?? "";

            tr.appendChild(td);

        });


        const medicalCell =
            document.createElement("td");

        medicalCell.innerHTML = row.medical_file
            ? '<a href="' + row.medical_file + '" target="_blank">عرض</a>'
            : makeUploadButton(row, "medical");

        tr.appendChild(medicalCell);


        const birthCertCell =
            document.createElement("td");

        birthCertCell.innerHTML = row.birth_certificate_file
            ? '<a href="' + row.birth_certificate_file + '" target="_blank">عرض</a>'
            : makeUploadButton(row, "birthCertificate");

        tr.appendChild(birthCertCell);

const whatsappCell =
            document.createElement("td");

        if(row.phone){

            const whatsappBtn =
                document.createElement("button");

            whatsappBtn.className = "btn-whatsapp";
            whatsappBtn.textContent = "📱 واتساب";
            whatsappBtn.onclick = () => sendWhatsapp(row);

            whatsappCell.appendChild(whatsappBtn);

        } else {
            whatsappCell.textContent = "—";
        }

        tr.appendChild(whatsappCell);
        const deleteCell =
            document.createElement("td");

        const deleteBtn =
            document.createElement("button");

        deleteBtn.className = "btn-delete";
        deleteBtn.textContent = "حذف";
        deleteBtn.onclick = () => deleteRegistration(row.id);

        deleteCell.appendChild(deleteBtn);
        tr.appendChild(deleteCell);


        body.appendChild(tr);

    });
function makeUploadButton(row, fileType){
    const inputId = "upload_" + fileType + "_" + row.id;
    return '<input type="file" accept="image/*,.pdf" id="' + inputId +
        '" style="display:none" onchange="uploadMissingFile(' + row.id +
        ',\'' + row.registration_number + '\',\'' + fileType +
        '\',this)">' +
        '<button class="btn-upload" onclick="document.getElementById(\'' +
        inputId + '\').click()">📎 رفع</button>';
}


function fileToBase64Admin(file){
    return new Promise((resolve, reject) => {

        if (!file.type.startsWith("image/")) {
            let reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
            return;
        }

        let img = new Image();
        let reader = new FileReader();

        reader.onload = (e) => {
            img.onload = () => {
                let maxSize = 1000;
                let width = img.width;
                let height = img.height;

                if (width > height && width > maxSize) {
                    height = Math.round(height * (maxSize / width));
                    width = maxSize;
                } else if (height > maxSize) {
                    width = Math.round(width * (maxSize / height));
                    height = maxSize;
                }

                let canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;
                let ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);

                resolve(canvas.toDataURL("image/jpeg", 0.7));
            };
            img.onerror = reject;
            img.src = e.target.result;
        };

        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}


async function uploadMissingFile(id, registrationNumber, fileType, inputEl){

    const file = inputEl.files[0];
    if(!file) return;

    const password =
        document.getElementById("password").value;

    try{

        const fileData = await fileToBase64Admin(file);

        const response =
        await fetch("/api/upload",{

            method:"POST",

            headers:{
                "Content-Type":"application/json",
                "x-admin-password":password
            },

            body: JSON.stringify({
                id,
                registrationNumber,
                fileType,
                fileData
            })

        });

        const data =
        await response.json();

        if(!response.ok){
            throw new Error(data.error || "فشل الرفع");
        }

        const fieldMap = {
            childPhoto: "child_photo_file",
            medical: "medical_file",
            birthCertificate: "birth_certificate_file"
        };

        const row = registrations.find(r => r.id === id);
        if(row){
            row[fieldMap[fileType]] = data.url;
        }

        showTable(registrations);

    } catch(error){
        alert("خطأ: " + error.message);
    }

}
}
function sendWhatsapp(row){

    let phone = row.phone.replace(/[^0-9]/g, "");

    if(phone.startsWith("0")){
        phone = "213" + phone.substring(1);
    }

    let message =
        "مرحبًا " + (row.parent_name || "") +
        "،\nنود إعلامكم بأن ملف تسجيل طفلكم " +
        (row.child_name || "") +
        " برقم " + row.registration_number +
        " قد تمت الموافقة عليه ✅\n" +
        "يرجى التقرب إلى مقر النادي الرياضي للسباحة بشار (CSB) لإتمام الإجراءات.\n" +
        "شكرًا لكم 🏊";

    let url =
        "https://wa.me/" + phone +
        "?text=" + encodeURIComponent(message);

    window.open(url, "_blank");

}


async function deleteRegistration(id){

    if(!confirm("هل أنت متأكد من حذف هذا التسجيل نهائيًا؟")){
        return;
    }

    const password =
        document.getElementById("password").value;

    try{

        const response =
        await fetch("/api/delete",{

            method:"POST",

            headers:{
                "Content-Type":"application/json",
                "x-admin-password":password
            },

            body: JSON.stringify({ id })

        });

        const data =
        await response.json();

        if(!response.ok){
            throw new Error(data.error || "فشل الحذف");
        }

        registrations =
            registrations.filter(row => row.id !== id);

        document.getElementById("count")
        .textContent =
        registrations.length;

        showTable(registrations);

    } catch(error){
        alert("خطأ: " + error.message);
    }

}


    function searchTable(){

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();


    const filtered =
        registrations.filter(row=>{

            return (

                String(row.child_name || "")
                .toLowerCase()
                .includes(search)

                ||

                String(row.parent_name || "")
                .toLowerCase()
                .includes(search)

                ||

                String(row.phone || "")
                .toLowerCase()
                .includes(search)

                ||

                String(row.registration_number || "")
                .toLowerCase()
                .includes(search)

            );

        });


    showTable(filtered);

}

</script>

</body>
</html>
